# Report drift from the authoritative GNOME GLib repository.
name: Upstream Monitor

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-monitor
  cancel-in-progress: true

jobs:
  compare-upstream:
    name: Compare official main and release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the GitHub master mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Compare branch and release tags
        shell: bash
        run: |
          set -euo pipefail
          upstream_url=https://gitlab.gnome.org/GNOME/glib.git
          git fetch --no-tags \
            "$upstream_url" \
            refs/heads/main:refs/remotes/upstream/main

          mirror_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse refs/remotes/upstream/main)
          read -r mirror_only upstream_only <<EOF
          $(git rev-list --left-right --count \
            HEAD...refs/remotes/upstream/main)
          EOF

          mirror_tags=$(mktemp)
          upstream_tags=$(mktemp)
          trap 'rm -f "$mirror_tags" "$upstream_tags"' EXIT
          list_release_tags() {
            git ls-remote --tags "$1" |
              awk '$2 !~ /\^\{\}$/ {
                name = $2
                sub("^refs/tags/", "", name)
                if (name ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) {
                  print name "\t" $1
                }
              }' |
              LC_ALL=C sort
          }
          list_release_tags origin > "$mirror_tags"
          list_release_tags "$upstream_url" > "$upstream_tags"
          tag_count=$(wc -l < "$mirror_tags" | tr -d ' ')
          tags_match=true
          if ! diff -u "$mirror_tags" "$upstream_tags"; then
            tags_match=false
          fi

          {
            echo '## Official upstream status'
            echo
            echo '| Ref | Commit |'
            echo '| --- | --- |'
            echo "| GitHub \`master\` | \`$mirror_sha\` |"
            echo "| Official \`main\` | \`$upstream_sha\` |"
            echo
            echo "Mirror-only commits: $mirror_only"
            echo
            echo "Upstream-only commits: $upstream_only"
            echo
            echo "Mirrored final release tags: $tag_count"
            echo
            echo "Release-tag refs match: $tags_match"
          } >> "$GITHUB_STEP_SUMMARY"

          if test "$mirror_sha" != "$upstream_sha"; then
            echo 'GitHub master differs from official main' >&2
            master_matches=false
          else
            master_matches=true
          fi
          if test "$master_matches" != true || test "$tags_match" != true; then
            echo 'Upstream mirror review is required' >&2
            exit 1
          fi
